<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Sign-in code</title><link rel="stylesheet" href="style.css">
<style>textarea{width:100%;box-sizing:border-box;font:14px/1.4 ui-monospace,Menlo,monospace;padding:12px;border-radius:8px;border:1px solid var(--muted);background:transparent;color:var(--fg)}button{margin-top:12px;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#111;font-weight:700;cursor:pointer}</style>
</head><body><main>
<h1>Almost done</h1>
<p class="muted" id="msg">Copy this whole address and paste it into the terminal that is waiting for it.</p>
<textarea id="url" rows="5" readonly></textarea>
<button id="copy">Copy</button>
<script>
  // Shows the sign-in redirect so the owner can paste it into the local script. Nothing is sent anywhere.
  const t = document.getElementById("url"), q = new URLSearchParams(location.search);
  t.value = location.href;
  if (q.get("error")) document.getElementById("msg").textContent = "Sign-in failed: " + q.get("error") + " " + (q.get("error_description") || "");
  document.getElementById("copy").onclick = () => { t.select(); navigator.clipboard?.writeText(t.value); };
</script>
</main></body></html>
